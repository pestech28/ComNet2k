<VirtualHost *:80>
    # The domain name or IP address users type to get here
    ServerName mobile.net
    ServerAlias www.mobile.net

    # The folder where your website's HTML/PHP files live
    DocumentRoot /var/www/html/mobile

    # Directory permissions
    <Directory /var/www/html/mobile>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Where Apache saves its error logs for troubleshooting
    ErrorLog ${APACHE_LOG_DIR}/access.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
