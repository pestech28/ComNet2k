<VirtualHost *:80>
    # The domain name or IP address users type to get here
    ServerName wii.com
    ServerAlias wii.com

    # The folder where your website's HTML/PHP files live
    DocumentRoot /var/www/html/redirect/wii

    # Directory permissions
    <Directory /var/www/html/redirect/wii>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Where Apache saves its error logs for troubleshooting
    ErrorLog ${APACHE_LOG_DIR}/access.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
